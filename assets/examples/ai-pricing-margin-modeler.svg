      <stop offset="0%" stop-color="#0a0e1a"/><stop offset="55%" stop-color="#10162c"/><stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
