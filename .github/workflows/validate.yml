name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check SKILL.md format and catalog listings
        run: python scripts/validate_skills.py
      - name: Smoke-test the installer
        run: |
          HOME="$RUNNER_TEMP" ./install.sh
          test -f "$RUNNER_TEMP/.claude/skills/dcf-valuation-builder/SKILL.md"
